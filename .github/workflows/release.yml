name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calathea-community-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Re-run required delivery gates
    runs-on: runner-calathea
    timeout-minutes: 30
    steps:
      - name: Check out tagged source without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require immutable tag on main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          tag_commit="$(git rev-list --max-count=1 "$GITHUB_REF_NAME")"
          test "$tag_commit" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Require committed producer flake lock
        run: |
          test -s flake.lock
          git ls-files --error-unmatch flake.lock >/dev/null

      - name: Set up pinned mise toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          cache: true

      - name: Validate reviewed release metadata
        run: nix develop --command python3 scripts/release.py validate-tag --tag "$GITHUB_REF_NAME"

      - name: Re-run repository quality gate
        env:
          FUZZ_TIME: 20s
        run: nix develop --command mise run ci

      - name: Re-run standalone package gate
        run: nix flake check

      - name: Verify producer flake lock stayed immutable
        run: git diff --exit-code -- flake.lock

  prepare:
    name: Validate tag and create draft
    needs: quality
    runs-on: runner-calathea
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out tagged source without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          persist-credentials: false

      - name: Create or reuse draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if nix develop --command gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(nix develop --command gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [ "$is_draft" != "true" ]; then
              echo "release $GITHUB_REF_NAME is already published and will not be modified" >&2
              exit 1
            fi
            nix develop --command gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --prerelease
          else
            nix develop --command gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --prerelease \
              --verify-tag \
              --notes-file "RELEASE_NOTES_${GITHUB_REF_NAME}.md" \
              --title "Calathea $GITHUB_REF_NAME"
          fi
          git diff --exit-code -- flake.lock

  build:
    name: Build and attest (${{ matrix.target }})
    needs:
      - quality
      - prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux/amd64
            goos: linux
            goarch: amd64
          - target: linux/arm64
            goos: linux
            goarch: arm64
          - target: darwin/amd64
            goos: darwin
            goarch: amd64
          - target: darwin/arm64
            goos: darwin
            goarch: arm64
    runs-on: runner-calathea
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out tagged source without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up pinned mise toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          cache: true

      - name: Capture deterministic source timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Build release binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          version="$(tr -d '\n' < VERSION)"
          mkdir -p target/release
          CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
            go build -trimpath \
            -ldflags "-s -w -X github.com/hackelia-micrantha/calathea-community/internal/application.Version=${version}" \
            -o target/release/calathea ./cmd/calathea

      - name: Generate deterministic SPDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          target_id="${{ matrix.goos }}-${{ matrix.goarch }}"
          nix develop --command python3 scripts/release.py sbom \
            --target "$target_id" \
            --output "dist/calathea-${GITHUB_REF_NAME}-${target_id}.spdx.json" \
            --epoch "$SOURCE_DATE_EPOCH" \
            --revision "$GITHUB_SHA"

      - name: Package deterministic archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          nix develop --command python3 scripts/release.py package \
            --target "${{ matrix.target }}" \
            --binary target/release/calathea \
            --sbom "dist/calathea-${GITHUB_REF_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}.spdx.json" \
            --dist dist \
            --epoch "$SOURCE_DATE_EPOCH"

      - name: Verify native release archive
        if: matrix.target == 'linux/amd64'
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\n' < VERSION)"
          verify_dir="$(mktemp -d)"
          tar -C "$verify_dir" -xzf "dist/calathea_${version}_linux_amd64.tar.gz"
          test "$("$verify_dir/calathea" version)" = "calathea ${version}"
          rm -rf "$verify_dir"

      - name: Verify producer flake lock stayed immutable
        run: git diff --exit-code -- flake.lock

      - name: Attest build provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-path: dist/*.tar.gz

      - name: Attest SPDX SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-path: dist/*.tar.gz
          sbom-path: dist/calathea-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.spdx.json

      - name: Upload immutable release inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          nix develop --command gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            dist/*.tar.gz \
            dist/*.tar.gz.sha256 \
            dist/*.spdx.json \
            --clobber
          git diff --exit-code -- flake.lock

  publish:
    name: Publish prerelease
    needs: build
    runs-on: runner-calathea
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tagged source without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          persist-credentials: false

      - name: Publish only after all targets succeed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          nix develop --command gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          git diff --exit-code -- flake.lock
