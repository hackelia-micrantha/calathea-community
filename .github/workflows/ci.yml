name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: calathea-community-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: runner-calathea
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up pinned mise toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          cache: true

      - name: Verify Nix and mise
        run: |
          nix --version
          nix develop --command mise --version

      - name: Verify formatting
        run: nix develop --command mise run format-check

      - name: Static analysis
        run: nix develop --command mise run static

      - name: Unit tests and coverage
        run: nix develop --command mise run test-unit

      - name: End-to-end CLI tests
        run: nix develop --command mise run test-e2e

      - name: Fuzz domain invariants
        env:
          FUZZ_TIME: 20s
        run: nix develop --command mise run fuzz

      - name: Vulnerability analysis
        run: nix develop --command mise run vuln

      - name: Build CLI
        run: nix develop --command mise run build

      - name: Validate release metadata
        run: |
          version="$(tr -d '\n' < VERSION)"
          nix develop --command python3 scripts/release.py validate-tag --tag "v${version}"

      - name: Verify standalone Nix contract
        run: |
          nix flake check
          nix build .#calathea
          version="$(tr -d '\n' < VERSION)"
          test "$(./result/bin/calathea version)" = "calathea ${version}"

      - name: Dry-run deterministic release packaging
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\n' < VERSION)"
          epoch="$(git show -s --format=%ct HEAD)"
          revision="$(git rev-parse HEAD)"
          rm -rf .ci-release
          mkdir -p .ci-release/target .ci-release/dist

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath \
            -ldflags "-s -w -X github.com/hackelia-micrantha/calathea-community/internal/application.Version=${version}" \
            -o .ci-release/target/calathea ./cmd/calathea

          nix develop --command python3 scripts/release.py sbom \
            --target linux-amd64 \
            --output .ci-release/dist/calathea-v${version}-linux-amd64.spdx.json \
            --epoch "$epoch" \
            --revision "$revision"

          nix develop --command python3 scripts/release.py package \
            --target linux/amd64 \
            --binary .ci-release/target/calathea \
            --sbom .ci-release/dist/calathea-v${version}-linux-amd64.spdx.json \
            --dist .ci-release/dist \
            --epoch "$epoch"

          archive=".ci-release/dist/calathea_${version}_linux_amd64.tar.gz"
          checksum="${archive}.sha256"
          test -s "$archive"
          test -s "$checksum"
          (cd .ci-release/dist && sha256sum -c "$(basename "$checksum")")

          verify_dir="$(mktemp -d)"
          tar -C "$verify_dir" -xzf "$archive"
          test "$("$verify_dir/calathea" version)" = "calathea ${version}"
          test -s "$verify_dir/SBOM.spdx.json"
          rm -rf "$verify_dir" .ci-release

      - name: Verify producer flake lock stayed immutable
        run: |
          test -s flake.lock
          git ls-files --error-unmatch flake.lock >/dev/null
          git diff --exit-code -- flake.lock
