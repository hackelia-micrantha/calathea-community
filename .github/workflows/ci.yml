name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: calathea-community-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify mise
        run: mise --version

      - name: Install pinned toolchain
        run: mise install

      - name: Verify formatting
        run: mise run format-check

      - name: SQLite persistence spike (CGO disabled)
        run: mise run sqlite-spike

      - name: Static analysis
        run: mise run static

      - name: Unit tests and coverage
        run: mise run test-unit

      - name: End-to-end CLI tests
        run: mise run test-e2e

      - name: Fuzz domain invariants
        env:
          FUZZ_TIME: 20s
        run: mise run fuzz

      - name: Vulnerability analysis
        run: mise run vuln

      - name: Build CLI
        run: mise run build
