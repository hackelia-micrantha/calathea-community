name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: calathea-community-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: runner-calathea
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up pinned mise toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          cache: true

      - name: Verify mise
        run: mise --version

      - name: Verify formatting
        run: mise run format-check

      - name: Static analysis
        run: mise run static

      - name: Unit tests and coverage
        run: mise run test-unit

      - name: End-to-end CLI tests
        run: mise run test-e2e

      - name: Fuzz domain invariants
        env:
          FUZZ_TIME: 20s
        run: mise run fuzz

      - name: Vulnerability analysis
        run: mise run vuln

      - name: Build CLI
        run: mise run build
