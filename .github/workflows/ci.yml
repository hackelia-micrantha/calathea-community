name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: calathea-community-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify mise
        run: mise --version

      - name: Install pinned toolchain
        run: mise install

      - name: Run quality gate
        run: mise run check
